name: Demo CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/streamlit-demo:${{ github.sha }} .
        docker tag ${{ secrets.DOCKER_USERNAME }}/streamlit-demo:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/streamlit-demo:latest

    - name: Push Docker Images
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/streamlit-demo:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/streamlit-demo:latest

    - name: Deploy Application to Cloud Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/streamlit-demo:latest

          docker stop streamlit-demo || true
          docker rm streamlit-demo || true

          docker run -d \
            --name streamlit-demo \
            -p 8501:8501 \
            --restart always \
            ${{ secrets.DOCKER_USERNAME }}/streamlit-demo:latest

